name: DevOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Show files
        run: ls -la

      - name: Build Docker image
        run: docker build -t my-nginx .

      - name: Done
        run: echo "Docker image built successfully 🚀"
